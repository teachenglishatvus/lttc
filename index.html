<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Things That Count – VUS Teachers' Day 2026</title>
<meta name="description" content="Share one small thing you do for your learners – VUS Teachers' Day 2026 contest for teachers and teaching assistants.">
<meta property="og:title" content="Little Things That Count – VUS Teachers' Day 2026">
<meta property="og:description" content="Share one small thing you do for your learners. Every qualified story gets a gift.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VUS – Teachers' Day 2026">
<meta property="og:url" content="https://teachenglishatvus.github.io/lttc/">
<!-- Link preview image (Facebook, Zalo, Messenger, email): the file thumbnail.jpg next to this page, 1200 × 630.
     To change it, upload a new thumbnail.jpg and add ?v=2, ?v=3… at the end of the two image links below so apps fetch the new one. -->
<meta property="og:image" content="https://teachenglishatvus.github.io/lttc/thumbnail.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Little Things That Count – VUS Teachers' Day 2026">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://teachenglishatvus.github.io/lttc/thumbnail.jpg?v=1">
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #FFFFFF; color: #1B1D2A; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .boot { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #C8001F; }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; color: #1A31B7; }
  .spin { width: 28px; height: 28px; border: 4px solid #D5D9EC; border-top-color: #1A31B7; border-radius: 50%; animation: s .9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  p { margin: 0; max-width: 460px; font-size: 15px; line-height: 1.55; color: #474B5E; }
  .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn.red { background: #C8001F; color: #FFFFFF; border: 0; }
  .btn.line { background: #FFFFFF; color: #1A31B7; border: 2px solid #1A31B7; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="boot">
  <span class="kicker">TEACHERS' DAY 2026</span>
  <h1>Little Things That Count</h1>
  <div class="spin" id="spin" aria-hidden="true"></div>
  <p id="msg" role="status">Loading the contest page…</p>
  <div class="row" id="acts" hidden>
    <button type="button" class="btn red" id="again">Try again</button>
    <a class="btn line" id="old" href="#">Open the page on Google</a>
  </div>
</main>
<script>
/* Little Things That Count – GitHub Pages copy of the contest portal (loader v49).
   Fastest first: 1) the page + data kept in this browser (return visits, instant);
   2) app.html + data.json next to this file – written into this repo by the contest's Apps Script every few minutes (Home in about 2 s);
   3) the contest's Google Apps Script itself (slower; used when the GitHub copy is missing or does not match).
   Server calls go straight to the script without Google cookies, which avoids the "several Google accounts" error of script.google.com. */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzUQdgXOqpr7VV7OptYDXPI9HDWhbY5LjhHwBymt4TXtod6JIob1Y0L7rgGo9yx5TjmgA/exec';
  window.__LT_API = API;
  var q = location.search ? '&' + location.search.slice(1) : '';
  var msg = document.getElementById('msg'), acts = document.getElementById('acts'), spin = document.getElementById('spin');
  document.getElementById('old').href = API + (location.search || '');
  document.getElementById('again').onclick = function () { location.reload(); };
  function fail(why) {
    spin.hidden = true; acts.hidden = false;
    msg.textContent = 'The contest page could not load' + (why ? ' (' + String(why).slice(0, 160) + ')' : '') + '. Check your connection and try again.';
  }
  var TK = 'lttc_tpl';
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  var sp = new URLSearchParams(location.search), tab = sp.get('tab') || '';
  function visitor(pp) {   // what belongs to this visit: the link it came from (?src=) and the tab to open (?tab=)
    pp.src = String(sp.get('src') || '').slice(0, 40); pp.initialTab = /^(home|prizes|ideas|join|terms)$/.test(tab) ? tab : 'home'; pp.wantTab = /^(submit|track)$/.test(tab) ? tab : '';
    return pp;
  }
  function show(tpl, json) {
    var html = tpl.replace('<head>', function () { return '<head><script>window.__LT_API=' + JSON.stringify(API) + '<\/script>'; }).replace('LT_PROPS_JSON', function () { return json; });
    document.open(); document.write(html); document.close();
  }
  function pj(pp) { return JSON.stringify(pp).replace(/</g, '\\u003c'); }
  var kept = store(function (ls) { return JSON.parse(ls.getItem(TK) || 'null'); });
  // 1) return visit: the page and its data are both kept in this browser (same version) → show them at once; the page then checks for newer data quietly
  var keptP = store(function (ls) { return JSON.parse(ls.getItem('lttc_props') || 'null'); });
  if (kept && kept.b && kept.tpl && keptP && keptP.b === kept.b && keptP.props && Date.now() - keptP.at < 7 * 864e5) {
    try {
      var pp = visitor(JSON.parse(keptP.props)); pp.__fromCache = 1; if (keptP.pub) pp.__pub = keptP.pub;
      show(kept.tpl, pj(pp));
      return;
    } catch (e) { store(function (ls) { ls.removeItem('lttc_props'); }); }   // something odd in the kept copy: load normally
  }
  // 2) the GitHub copy (app.html + data.json in this repo)
  var t = Math.floor(Date.now() / 60000), ghCtl = window.AbortController ? new AbortController() : null, ghTimer = setTimeout(function () { if (ghCtl) ghCtl.abort(); }, 7000);
  function get(path, json) {
    return fetch(path + '?t=' + t, ghCtl ? { signal: ghCtl.signal, cache: 'no-store' } : { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(path + ' ' + r.status); return json ? r.json() : r.text(); });
  }
  function buildOf(tpl) { return (/<meta name="lt-build" content="([^"]*)"/.exec(tpl || '') || [])[1] || ''; }
  var ghPage = null;   // app.html is downloaded only when this browser does not have this version yet
  get('data.json', true).then(function (d) {
    if (!d || !d.props || !d.b) throw new Error('no data');
    if (kept && kept.b === d.b && kept.tpl) return [kept.tpl, d];
    return (ghPage || get('app.html', false)).then(function (tpl) { if (buildOf(tpl) !== d.b) throw new Error('page and data are from different versions'); store(function (ls) { ls.setItem(TK, JSON.stringify({ b: d.b, tpl: tpl })); }); return [tpl, d]; });
  }).then(function (x) {
    clearTimeout(ghTimer);
    var pp = visitor(JSON.parse(x[1].props)); pp.__pub = x[1].pub;
    show(x[0], pj(pp));
  }).catch(function () { clearTimeout(ghTimer); fromWebApp(); });
  if (!(kept && kept.tpl)) ghPage = get('app.html', false);   // first visit: download the page at the same time as the data
  if (ghPage) ghPage.catch(function () {});
  // 3) the web app itself
  function fromWebApp() {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 60000);
    var slow = setTimeout(function () { msg.textContent = 'Still loading – this can take a few seconds…'; }, 5000);
    function load(useKept) {
      var shell = '&shell=' + encodeURIComponent(useKept && kept && kept.b ? kept.b : '');   // empty = send me the page too
      return fetch(API + '?api=portal' + q + shell, ctl ? { signal: ctl.signal } : {})
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.ok) return fail(d && d.error);
          if (d.tpl) store(function (ls) { ls.setItem(TK, JSON.stringify({ b: d.build, tpl: d.tpl })); });
          var tpl = d.tpl || (kept && kept.b === d.build ? kept.tpl : '');
          if (!d.props && d.html) tpl = '';   // older web app: the whole page comes ready
          if (!tpl && !d.html) return useKept ? load(false) : fail('empty page');
          clearTimeout(timer); clearTimeout(slow);
          if (tpl) show(tpl, d.props); else { document.open(); document.write(d.html); document.close(); }
        });
    }
    load(true).catch(function (e) { clearTimeout(timer); clearTimeout(slow); fail(e && e.name === 'AbortError' ? 'timed out' : (e && e.message)); });
  }
})();
</script>
</body>
</html>
